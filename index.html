<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Event Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Exam Registration Form</h2>

    <form id="registrationForm">

        <div class="row">
            <label>First Name</label>
            <input type="text" id="fname">
        </div>

        <div class="row">
            <label>Last Name</label>
            <input type="text" id="lname">
        </div>

        <div class="row">
            <label>Father's Name</label>
            <input type="text" id="father">
        </div>

        <div class="row">
            <label>Mother's Name</label>
            <input type="text" id="mother">
        </div>

        <div class="row">
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>

        <div class="row">
            <label>Gender</label>

            <div class="gender">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

        </div>
<div class="row">
Enter your Phone number:<input type="number" id="mobile no">
</div>

        <div class="row">
            <label>Educational Details</label>

            <textarea id="education" rows="4"
                placeholder="Qualification, Board/University, Year, Percentage"></textarea>
        </div>

        <div class="row">
            <label>Passport Size Photo</label>
            <input type="file" id="photo" accept="image/*">
        </div>

        <div class="row">
        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
</div>

<script src="script.js"></script>

</body>
</html>
